name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is pinned: setup-python has no Python 3.9 build for newer images
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Node and Java give the language tests something to run; any missing toolchain is reported as SKIP.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Content and engine self-test
        run: python tests/selftest.py
      - name: Server end-to-end test
        run: python tests/api_test.py
      - name: Multi-language test
        run: python tests/lang_test.py
